[project]
name = "flask-demo"
version = "0.1.0"
dependencies = [
    "Flask>=3.1.0",
    "Flask-Cors>=3.0.10",
    "Flask-RESTful>=0.3.9",
    "Flask-APScheduler>=1.12.4",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.1.0",
    "Flask-Login>=0.6.3",
    "Flask-Bcrypt>=1.0.1",
    "Flask-Caching>=2.0.1",
    "pymysql>=1.0.2",
    "loguru>=0.7.2",
    "gevent>=23.9.1",
    "celery==5.5.1",
    "vine==5.1.0",
    "eventlet==0.39.1",
    "python-dotenv>=1.0.0",
    "redis>=4.5.0",
    "pydantic-settings>=2.14.0",
    "flask-wtf>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-flask>=1.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
python-version = "3.9"

[tool.setuptools]
packages = ["app", "com"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
